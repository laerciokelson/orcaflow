name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: orcaflow_test
          MYSQL_USER: orcaflow
          MYSQL_PASSWORD: orcaflow
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orcaflow_test
      DB_USERNAME: orcaflow
      DB_PASSWORD: orcaflow
      REDIS_HOST: 127.0.0.1
      REDIS_DB: 10
      REDIS_CACHE_DB: 11
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_mysql, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Wayfinder
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Verify Wayfinder output
        run: |
          test -s resources/js/routes/index.ts
          test -s resources/js/actions/App/index.ts

      - name: Pint
        run: ./vendor/bin/pint --test --parallel

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Pest
        env:
          APP_ENV: testing
        run: php artisan test

      - name: Build frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database
        env:
          APP_ENV: e2e
        run: php artisan migrate:fresh --force --seed --seeder=Database\\Seeders\\E2eSeeder

      - name: Playwright
        env:
          APP_ENV: e2e
          APP_URL: http://127.0.0.1:8000
          E2E_BASE_URL: http://127.0.0.1:8000
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
          npx playwright test
